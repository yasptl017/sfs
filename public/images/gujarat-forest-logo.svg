<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#forestGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="70" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Tree Canopy / Banyan Tree Motif -->
  <g transform="translate(100, 92)">
    <!-- Tree Leaves (Lush Canopy) -->
    <path d="M 0 -48 C -22 -48, -42 -32, -42 -12 C -42 -2, -35 8, -26 12 C -30 20, -22 28, -12 28 C -5 28, 0 24, 0 24 C 0 24, 5 28, 12 28 C 22 28, 30 20, 26 12 C 35 8, 42 -2, 42 -12 C 42 -32, 22 -48, 0 -48 Z" fill="#047857" opacity="0.9" />
    <path d="M 0 -42 C -18 -42, -34 -28, -34 -12 C -34 -2, -28 6, -20 10 C -24 16, -18 22, -10 22 C -4 22, 0 18, 0 18 C 0 18, 4 22, 10 22 C 18 22, 24 16, 20 10 C 28 6, 34 -2, 34 -12 C 34 -28, 18 -42, 0 -42 Z" fill="#10b981" />
    
    <!-- Tree Trunk and Spreading Roots -->
    <path d="M -5 14 Q -7 32, -14 42 L 14 42 Q 7 32, 5 14 Z" fill="#78350f" />
    <path d="M 0 14 L 0 34 M -6 22 Q -12 28, -18 32 M 6 22 Q 12 28, 18 32" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Ashoka Lion Pillar Capital Silhouette in Center -->
    <g transform="translate(0, -6) scale(0.65)">
      <!-- Central Lion -->
      <circle cx="0" cy="-8" r="7" fill="#ca8a04" />
      <path d="M -6 -4 Q 0 8, 6 -4 Q 10 12, 0 18 Q -10 12, -6 -4 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
      <!-- Left Lion Profile -->
      <path d="M -6 -7 Q -14 -6, -12 2 Q -7 8, -4 4 Z" fill="#ca8a04" />
      <!-- Right Lion Profile -->
      <path d="M 6 -7 Q 14 -6, 12 2 Q 7 8, 4 4 Z" fill="#ca8a04" />
      <!-- Base Chakra -->
      <circle cx="0" cy="22" r="6" fill="none" stroke="#1e3a8a" stroke-width="1.5" />
      <path d="M 0 16 L 0 28 M -6 22 L 6 22 M -4 18 L 4 26 M -4 26 L 4 18" stroke="#1e3a8a" stroke-width="0.8" />
    </g>
  </g>

  <!-- Banner Ribbon at Bottom -->
  <g transform="translate(100, 160)">
    <path d="M -65 0 L -50 -10 L 50 -10 L 65 0 L 48 10 L -48 10 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" filter="url(#shadow)" />
    <text x="0" y="2" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#14532d" text-anchor="middle" letter-spacing="1">GUJARAT FOREST</text>
  </g>

  <!-- Circular Text Around Arc -->
  <path id="textArcTop" d="M 24 100 A 76 76 0 0 1 176 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      GUJARAT STATE FOREST DEPT
    </textPath>
  </text>
</svg>
